<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playwright Execution Farm - Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; font-weight: bold; }
        .version-badge { background: #1e293b; padding: 8px 16px; border-radius: 6px; font-size: 12px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; }
        .tab { padding: 12px 20px; cursor: pointer; background: none; border: none; color: #94a3b8; border-bottom: 2px solid transparent; }
        .tab.active { color: #0ea5e9; border-bottom-color: #0ea5e9; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
        .card-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
        .card-value { font-size: 32px; font-weight: bold; }
        .card-subtitle { font-size: 12px; color: #64748b; margin-top: 8px; }
        
        .form { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; }
        .form-group input::placeholder { color: #64748b; }
        
        button { padding: 10px 20px; background: #0ea5e9; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0284c7; }
        button.secondary { background: #334155; }
        button.secondary:hover { background: #475569; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        
        .job-list { background: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
        .job-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #334155; }
        .job-item:last-child { border-bottom: none; }
        
        .job-info { flex: 1; }
        .job-id { font-family: monospace; font-size: 12px; color: #64748b; }
        .job-file { font-weight: bold; margin: 5px 0; }
        .job-status { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .status-running { background: #fbbf24; color: #000; }
        .status-passed { background: #10b981; color: white; }
        .status-failed { background: #ef4444; color: white; }
        .status-queued { background: #64748b; color: white; }
        
        .logs { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.4; }
        .log-line { margin: 2px 0; }
        .log-error { color: #ef4444; }
        .log-success { color: #10b981; }
        .log-info { color: #0ea5e9; }
        
        .progress-bar { width: 100%; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: #0ea5e9; transition: width 0.3s; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; border-radius: 8px; padding: 30px; max-width: 500px; width: 90%; }
        .modal-header { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .modal-close { float: right; font-size: 24px; cursor: pointer; color: #94a3b8; }
        
        .upload-drop { border: 2px dashed #334155; border-radius: 8px; padding: 40px; text-align: center; background: #0f172a; cursor: pointer; }
        .upload-drop.dragover { border-color: #0ea5e9; background: #1e293b; }
        
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .worker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .worker-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
        .worker-status { width: 10px; height: 10px; border-radius: 50%; background: #10b981; display: inline-block; margin-right: 8px; }
        .worker-info { font-size: 12px; color: #94a3b8; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function Dashboard() {
            const [activeTab, setActiveTab] = useState('jobs');
            const [jobs, setJobs] = useState([]);
            const [summary, setSummary] = useState(null);
            const [selectedJob, setSelectedJob] = useState(null);
            const [ws, setWs] = useState(null);
            const [logs, setLogs] = useState([]);
            const [workers, setWorkers] = useState([]);
            const [uploadFile, setUploadFile] = useState(null);
            const wsRef = useRef(null);

            useEffect(() => {
                fetchSummary();
                fetchJobs();
                fetchWorkers();
                const interval = setInterval(() => {
                    fetchSummary();
                    fetchJobs();
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            const fetchSummary = async () => {
                try {
                    const res = await fetch('http://127.0.0.1:8000/dashboard/summary');
                    const data = await res.json();
                    setSummary(data);
                } catch (e) { }
            };

            const fetchJobs = async () => {
                try {
                    const res = await fetch('http://127.0.0.1:8000/jobs');
                    const data = await res.json();
                    setJobs(data.jobs);
                } catch (e) { }
            };

            const fetchWorkers = async () => {
                try {
                    const res = await fetch('http://127.0.0.1:8000/workers');
                    const data = await res.json();
                    setWorkers(data.workers);
                } catch (e) { }
            };

            const createJob = async (testFile = 'test_demo.py') => {
                try {
                    const res = await fetch('http://127.0.0.1:8000/jobs?test_file=' + testFile, {
                        method: 'POST'
                    });
                    const data = await res.json();
                    setSelectedJob(data.job_id);
                    setLogs([]);
                    connectWebSocket(data.job_id);
                    setActiveTab('logs');
                } catch (e) {
                    alert('Error creating job');
                }
            };

            const connectWebSocket = (jobId) => {
                if (wsRef.current) wsRef.current.close();
                const ws = new WebSocket(`ws://127.0.0.1:8000/ws/${jobId}`);
                ws.onmessage = (event) => {
                    setLogs(prev => [...prev, event.data]);
                };
                wsRef.current = ws;
            };

            const handleUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const res = await fetch('http://127.0.0.1:8000/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    alert(`Uploaded ${data.count} test files`);
                    if (data.test_files.length > 0) {
                        createJob(data.test_files[0]);
                    }
                } catch (e) {
                    alert('Upload failed');
                }
            };

            const cancelJob = async (jobId) => {
                try {
                    await fetch(`http://127.0.0.1:8000/jobs/${jobId}/cancel`, {
                        method: 'POST'
                    });
                    fetchJobs();
                } catch (e) { }
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>🚀 Playwright Execution Farm</h1>
                        <div className="version-badge">Version 2.0 | Phases 1-10</div>
                    </div>

                    {summary && (
                        <div className="grid">
                            <div className="card">
                                <div className="card-title">Total Jobs</div>
                                <div className="card-value">{summary.total_jobs}</div>
                                <div className="progress-bar"><div className="progress-fill" style={{width: '100%'}}></div></div>
                            </div>
                            <div className="card">
                                <div className="card-title">Passed</div>
                                <div className="card-value" style={{color: '#10b981'}}>{summary.passed}</div>
                            </div>
                            <div className="card">
                                <div className="card-title">Failed</div>
                                <div className="card-value" style={{color: '#ef4444'}}>{summary.failed}</div>
                            </div>
                            <div className="card">
                                <div className="card-title">Success Rate</div>
                                <div className="card-value">{summary.success_rate.toFixed(1)}%</div>
                            </div>
                        </div>
                    )}

                    <div className="tabs">
                        <button className={`tab ${activeTab === 'jobs' ? 'active' : ''}`} onClick={() => setActiveTab('jobs')}>Jobs</button>
                        <button className={`tab ${activeTab === 'create' ? 'active' : ''}`} onClick={() => setActiveTab('create')}>New Job</button>
                        <button className={`tab ${activeTab === 'logs' ? 'active' : ''}`} onClick={() => setActiveTab('logs')}>Live Logs</button>
                        <button className={`tab ${activeTab === 'workers' ? 'active' : ''}`} onClick={() => setActiveTab('workers')}>Workers</button>
                        <button className={`tab ${activeTab === 'matrix' ? 'active' : ''}`} onClick={() => setActiveTab('matrix')}>Browser Matrix</button>
                    </div>

                    {activeTab === 'jobs' && (
                        <div>
                            <h2 className="section-title">Recent Jobs</h2>
                            {jobs.length > 0 ? (
                                <div className="job-list">
                                    {jobs.map(job => (
                                        <div key={job.id} className="job-item">
                                            <div className="job-info">
                                                <div className="job-id">{job.id.substring(0, 12)}...</div>
                                                <div className="job-file">{job.test_file}</div>
                                                <div>
                                                    <span className={`job-status status-${job.status}`}>{job.status.toUpperCase()}</span>
                                                    {job.exit_code !== null && <span style={{marginLeft: '10px', fontSize: '12px', color: '#64748b'}}>Exit: {job.exit_code}</span>}
                                                </div>
                                            </div>
                                            <div style={{textAlign: 'right'}}>
                                                <button className="secondary" onClick={() => {
                                                    setSelectedJob(job.id);
                                                    setActiveTab('logs');
                                                }}>View</button>
                                                {job.status === 'running' && (
                                                    <button className="danger" style={{marginLeft: '5px'}} onClick={() => cancelJob(job.id)}>Cancel</button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="card" style={{textAlign: 'center', color: '#64748b'}}>No jobs yet</div>
                            )}
                        </div>
                    )}

                    {activeTab === 'create' && (
                        <div>
                            <h2 className="section-title">Create New Job</h2>
                            <div className="form">
                                <div className="form-group">
                                    <label>Test File</label>
                                    <input type="text" placeholder="test_demo.py" defaultValue="test_demo.py" onInput={(e) => {}} />
                                </div>
                                <button onClick={() => createJob('test_demo.py')}>Run Test</button>
                            </div>

                            <h2 className="section-title" style={{marginTop: '30px'}}>Upload Test ZIP</h2>
                            <div className="form">
                                <div className="upload-drop" onClick={() => document.getElementById('fileInput').click()}>
                                    <div style={{fontSize: '32px', marginBottom: '10px'}}>📁</div>
                                    <div>Click or drag ZIP file here</div>
                                    <input type="file" id="fileInput" accept=".zip" onChange={handleUpload} style={{display: 'none'}} />
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'logs' && (
                        <div>
                            <h2 className="section-title">Live Execution Logs {selectedJob && `(${selectedJob.substring(0, 8)}...)`}</h2>
                            <div className="logs">
                                {logs.length > 0 ? (
                                    logs.map((log, i) => (
                                        <div key={i} className="log-line">
                                            {JSON.stringify(log).substring(0, 150)}...
                                        </div>
                                    ))
                                ) : (
                                    <div style={{color: '#64748b'}}>Select a job to view logs</div>
                                )}
                            </div>
                        </div>
                    )}

                    {activeTab === 'workers' && (
                        <div>
                            <h2 className="section-title">Worker Pool (Phase 6)</h2>
                            <div className="worker-grid">
                                {workers.map(worker => (
                                    <div key={worker.id} className="worker-card">
                                        <div>
                                            <span className="worker-status"></span>
                                            <strong>{worker.name}</strong>
                                        </div>
                                        <div className="worker-info">
                                            <div>Provider: {worker.provider}</div>
                                            <div>Jobs: {worker.current_jobs}/{worker.max_jobs}</div>
                                            <div>Status: {worker.status}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'matrix' && (
                        <div>
                            <h2 className="section-title">Browser Matrix (Phase 7)</h2>
                            <div className="form">
                                <div className="form-group">
                                    <label>Browsers</label>
                                    <select>
                                        <option>Chrome</option>
                                        <option>Firefox</option>
                                        <option>Safari</option>
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label>Devices</label>
                                    <select>
                                        <option>Desktop</option>
                                        <option>Mobile</option>
                                        <option>Tablet</option>
                                    </select>
                                </div>
                                <button>Run Matrix Test</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
