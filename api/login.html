<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Playwright Execution Farm</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="nav">
  <div class="brand"><a href="/" style="color:inherit;">🚀 Playwright Execution Farm</a></div>
  <div class="links"><a href="/signup">Need an account?</a></div>
</nav>
<div class="container narrow">
  <h1 style="font-size:28px;">Log in</h1>
  <div class="auth-card">
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@company.com">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••">
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <div class="switch">
      <a href="/reset-password">Forgot password?</a> · <a href="/signup">Create an account</a>
    </div>
    <div class="notice">
      This form isn't connected to a real account system yet — there's no
      user database, password hashing, or session handling behind it. It's
      UI only, ready to wire up once account storage is built.
    </div>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  alert('Login isn\'t wired to a backend yet - see the notice below the form.');
});
</script>
</body>
</html>
